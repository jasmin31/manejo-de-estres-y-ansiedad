<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contacto - Calma</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="header">
  <nav class="nav container">
    <a href="index.html" class="logo">Calma+Bienestar</a>
    <button id="navToggle" class="nav-toggle" aria-label="Abrir menú">☰</button>
    <ul id="nav" class="nav-links">
      <li><a href="index.html">Inicio</a></li>
      <li><a href="index.html#informacion">Información</a></li>
      <li><a href="index.html#recursos">Recursos</a></li>
      <li><a href="index.html#quiz">Quiz</a></li>
      <li><a href="index.html#contacto">Contacto</a></li>
    </ul>
  </nav>
</header>
<main class="main-content">
  <section class="section page page-contacto alt">
    <div class="section-inner">
      <h1>Contacto</h1>
      <p>¿Dudas o comentarios sobre el sitio? Escríbenos.</p>
      <form id="contactForm" class="contact-form" novalidate>
        <label for="name">Nombre</label>
        <input type="text" id="name" name="name" required>
        <span class="error" id="nameError"></span>

        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" required>
        <span class="error" id="emailError"></span>

        <label for="message">Mensaje</label>
        <textarea id="message" name="message" rows="5" required></textarea>
        <span class="error" id="messageError"></span>

        <button type="submit" class="btn">Enviar</button>
        <p id="formSuccess" class="success hidden">Mensaje enviado correctamente (simulado, sin backend).</p>
      </form>
    </div>
  </section>
</main>
<footer class="footer">
  <p>&copy; 2026 Calma — Sitio informativo sobre estrés y ansiedad.</p>
</footer>
<script src="js/script.js"></script>
</body>
</html>
